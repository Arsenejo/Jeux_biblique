name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vérifier la banque Défi Jean
        run: node verifier-questions.js
      - name: Installer et tester Le Grand Pèlerinage
        run: npm --prefix grand_pelerinage_v1 install && npm --prefix grand_pelerinage_v1 test
